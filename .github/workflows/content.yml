name: content
on:
  pull_request:
    paths: ["services/content/**", "engine/contracts/**", "engine/specs/compliance-rules.json"]
  push:
    branches: [main]
    paths: ["services/content/**", "engine/contracts/**", "engine/specs/compliance-rules.json"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
