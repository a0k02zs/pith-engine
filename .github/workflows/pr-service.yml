name: pr-service
on:
  pull_request:
    paths: ["services/pr-thought-leadership/**", "engine/**"]
  push:
    branches: [main]
    paths: ["services/pr-thought-leadership/**", "engine/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pr-thought-leadership
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
