name: affiliate
on:
  pull_request:
    paths: ["services/affiliate/**", "engine/contracts/**"]
  push:
    branches: [main]
    paths: ["services/affiliate/**", "engine/contracts/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/affiliate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
