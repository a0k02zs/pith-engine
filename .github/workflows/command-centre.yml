name: command-centre
on:
  pull_request:
    paths: ["apps/command-centre/**", "services/*/workflows/**", "engine/contracts/**", "packages/**", ".github/workflows/command-centre.yml"]
  push:
    branches: [main]
    paths: ["apps/command-centre/**", "services/*/workflows/**", "engine/contracts/**", "packages/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/command-centre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
