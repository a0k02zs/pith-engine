name: contracts
on:
  pull_request:
    paths: ["engine/**"]
  push:
    branches: [main]
    paths: ["engine/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - run: python engine/scripts/validate_contracts.py
